# Intentionally not migrated: the former Chromium snapshot endpoint returned an
# opaque ZIP without stable metadata; Atom is end-of-life; the former Android
# URL contained temporary tracking/host parameters; the unknown "antigravity"
# payload was not sufficiently attributable; and old pinned Midori, Waterfox,
# SeaMonkey, Opera, Min, Steam, Stremio, Floorp, and Mullvad URLs need individual
# upstream verification before they can be enabled safely.
